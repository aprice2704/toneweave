root = "."
tmp_dir = "tmp"

[build]
 cmd = "go build -o ./tmp/toneweave ."
 entrypoint = ["./tmp/toneweave", "-port", "8097"]
 include_ext = ["go", "html", "css", "js"]
 exclude_dir = [".git", "tmp"]
 delay = 150
 stop_on_error = true
 send_interrupt = true
 kill_delay = "250ms"

[log]
 time = false

[misc]
 clean_on_exit = true